name: PR Review Tracker
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [PR Review Tracker Signal]
    types: [completed]
permissions: {}
jobs:
  resolve:
    name: Authorize and resolve event
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       startsWith(github.event.comment.body, '/review-tracker ')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      review: ${{ steps.resolve.outputs.review }}
      action: ${{ steps.resolve.outputs.action }}
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: resolve
        name: Validate event
        uses: ./.github/actions/review-tracker
        with:
          mode: resolve
          github-token: ${{ github.token }}
  process:
    name: Process review tracking event
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: review-tracker-project-47-pr-${{ needs.resolve.outputs.pr }}
      queue: max
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Track reviews
        uses: ./.github/actions/review-tracker
        with:
          mode: process
          github-token: ${{ github.token }}
          projects-token: ${{ secrets.PROJECTS_TOKEN }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          pr-number: ${{ needs.resolve.outputs.pr }}
          review-id: ${{ needs.resolve.outputs.review }}
          event-action: ${{ needs.resolve.outputs.action }}
