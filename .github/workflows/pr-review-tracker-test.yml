name: PR Review Tracker Tests

on:
  pull_request:
    paths:
      - .github/actions/review-tracker/**
      - .github/workflows/pr-review-tracker-*.yml
  push:
    paths:
      - .github/actions/review-tracker/**
      - .github/workflows/pr-review-tracker-*.yml

permissions:
  contents: read

jobs:
  test:
    name: Test review tracker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint review tracker workflows
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="${RUNNER_TEMP}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_ARCHIVE_SHA256}  ${archive}" |
            sha256sum --check --strict
          tar \
            --extract \
            --gzip \
            --file "${archive}" \
            --directory "${RUNNER_TEMP}" \
            actionlint
          "${RUNNER_TEMP}/actionlint" \
            -color \
            .github/workflows/pr-review-tracker-*.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/actions/review-tracker/package-lock.json

      - name: Install locked dependencies
        working-directory: .github/actions/review-tracker
        run: npm ci --ignore-scripts

      - name: Run unit tests
        working-directory: .github/actions/review-tracker
        run: npm test

      - name: Verify committed bundle
        run: |
          npm --prefix .github/actions/review-tracker run notices
          npm --prefix .github/actions/review-tracker run build
          git diff --exit-code -- \
            .github/actions/review-tracker/THIRD_PARTY_NOTICES.txt \
            .github/actions/review-tracker/dist/
